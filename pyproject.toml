[project]
name = "macro-recorder"
version = "0.1.0"
description = "Record, edit and replay mouse and keyboard macros on Windows"
requires-python = ">=3.12"
dependencies = [
    "pyautogui>=0.9.54",
    "pynput>=1.7.6",
    "pywin32>=305; sys_platform == 'win32'",
    "Pillow>=9",
    "winsdk>=1.0.0b10; sys_platform == 'win32'",
    "mss>=9",
    "opencv-python>=4.8",
]

[project.scripts]
macro-recorder = "macro_recorder.run:main"
macro-recorder-cli = "macro_recorder.main:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
