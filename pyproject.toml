[project]
name = "macro-recorder"
version = "0.2.0"
description = "Record, edit and replay mouse and keyboard macros on Linux (X11)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pynput>=1.8",
    "python-xlib>=0.33",
    "Pillow>=10",
    "mss>=9",
    "opencv-python-headless>=4.8",
    "pytesseract>=0.3.10",
]

[project.scripts]
macro-recorder = "macro_recorder.app:main"
macro-recorder-cli = "macro_recorder.cli:main"

[tool.uv]
# A uv-managed CPython bundles tkinter, so the GUI needs no python3-tk package.
python-preference = "only-managed"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_x: opens windows on an X display; run only under Xvfb"]
